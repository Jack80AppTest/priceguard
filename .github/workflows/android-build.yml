name: Android APK

on:
  push:
    branches:
      - "dev/v0.1.3-appid"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Lint and build APK
        run: gradle --no-daemon clean lintDebug assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/PriceGuard-v0.1.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceGuard-v0.1.3-debug
          path: output/PriceGuard-v0.1.3-debug.apk
          if-no-files-found: error
